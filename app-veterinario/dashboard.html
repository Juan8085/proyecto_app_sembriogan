<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sembriogan Vet - Panel Operativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center sticky top-0 z-50 border-b border-slate-200">
        <div class="flex items-center space-x-3">
            <img src="img/logo.png" alt="Logo Sembriogan" class="h-10 object-contain">
            <div>
                <h1 id="nombre-vet" class="text-sm font-bold text-slate-800">Veterinario</h1>
                <p class="text-xs text-sky-600 font-semibold">Modo Campo (Offline Ready)</p>
            </div>
        </div>
        <button id="btn-salir" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold transition">
            Salir
        </button>
    </header>

    <main class="flex-1 p-6 max-w-md mx-auto w-full space-y-6">
        
        <!-- Estado de Red / Sincronización -->
        <div id="estado-red" class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-bold transition-colors">
            <span id="texto-conexion" class="flex items-center gap-2">🟢 Conectado al Servidor</span>
            <button id="btn-sync" onclick="sincronizarPendientes()" class="bg-emerald-200 px-2.5 py-1 rounded-full cursor-pointer hover:bg-emerald-300">0 pendientes</button>
        </div>

        <!-- Módulos de Operación de Campo -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer" onclick="window.location.href='registro.html'">
                <div>
                    <div class="w-12 h-12 bg-sky-50 rounded-2xl flex items-center justify-center text-2xl mb-3">💉</div>
                    <h3 class="font-bold text-slate-800 text-sm">Registro IATF / TE</h3>
                    <p class="text-slate-500 text-xs mt-1">Control reproductivo y preñez.</p>
                </div>
                <span class="text-sky-600 font-bold text-xs mt-4 block">Registrar Nuevo →</span>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer" onclick="window.location.href='catalogo.html'">
                <div>
                    <div class="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center text-2xl mb-3">📦</div>
                    <h3 class="font-bold text-slate-800 text-sm">Insumos y Catálogo</h3>
                    <p class="text-slate-500 text-xs mt-1">Compra de material genético e insumos.</p>
                </div>
                <span class="text-amber-600 font-bold text-xs mt-4 block">Explorar →</span>
            </div>
        </div>

        <!-- MIS PROCEDIMIENTOS ACTIVOS -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Mis Procedimientos en Proceso</h3>
                <button onclick="cargarMisProcedimientos()" class="text-xs text-sky-600 font-bold bg-sky-50 px-2 py-1 rounded-lg hover:bg-sky-100">↻ Actualizar</button>
            </div>
            
            <div id="lista-procedimientos" class="space-y-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center text-xs text-slate-500">
                    Cargando procedimientos... (Requiere internet)
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('tokenVet');
            const usuarioStr = localStorage.getItem('usuarioVet');

            if (!token || !usuarioStr) {
                window.location.href = 'index.html';
                return;
            }

            const usuario = JSON.parse(usuarioStr);
            document.getElementById('nombre-vet').textContent = usuario.nombre || 'Veterinario';

            document.getElementById('btn-salir').addEventListener('click', () => {
                localStorage.removeItem('tokenVet');
                localStorage.removeItem('usuarioVet');
                window.location.href = 'index.html';
            });

            window.addEventListener('online', () => {
                actualizarEstadoRed();
                sincronizarPendientes(); // Intenta sincronizar automáticamente al recuperar señal
            });
            window.addEventListener('offline', actualizarEstadoRed);
            
            actualizarEstadoRed();
            cargarMisProcedimientos();
        });

        function actualizarEstadoRed() {
            const btnSync = document.getElementById('btn-sync');
            const estadoRed = document.getElementById('estado-red');
            const textoConexion = document.getElementById('texto-conexion');
            const cola = JSON.parse(localStorage.getItem('colaRegistros') || '[]');
            
            btnSync.textContent = `${cola.length} pendientes`;

            if (navigator.onLine) {
                estadoRed.className = "bg-emerald-50 border border-emerald-200 text-emerald-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-bold transition-colors";
                textoConexion.innerHTML = "🟢 Conectado al Servidor";
                if (cola.length > 0) btnSync.classList.add('animate-pulse', 'bg-emerald-300');
                else btnSync.classList.remove('animate-pulse', 'bg-emerald-300');
            } else {
                estadoRed.className = "bg-amber-50 border border-amber-200 text-amber-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-bold transition-colors";
                textoConexion.innerHTML = "🔴 Modo Offline Activo";
                btnSync.classList.remove('animate-pulse', 'bg-emerald-300');
            }
        }

        // MOTOR DE SINCRONIZACIÓN DE LA COLA OFFLINE
        async function sincronizarPendientes() {
            if (!navigator.onLine) return;

            let cola = JSON.parse(localStorage.getItem('colaRegistros') || '[]');
            if (cola.length === 0) return;

            const token = localStorage.getItem('tokenVet');
            let noSincronizados = [];
            let exitosos = 0;

            // Recorremos y enviamos cada registro atascado
            for (let registro of cola) {
                try {
                    const res = await fetch('http://localhost:3000/api/registro-genetico', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(registro)
                    });
                    
                    const data = await res.json();
                    if (data.success) {
                        exitosos++;
                    } else {
                        noSincronizados.push(registro);
                    }
                } catch (error) {
                    noSincronizados.push(registro);
                }
            }

            // Actualizamos el almacenamiento local dejando solo los que fallaron
            localStorage.setItem('colaRegistros', JSON.stringify(noSincronizados));
            actualizarEstadoRed();
            cargarMisProcedimientos();

            if (exitosos > 0) {
                alert(`¡Se sincronizaron ${exitosos} registros pendientes con éxito!`);
            }
        }

        // CARGAR PROCEDIMIENTOS DEL VETERINARIO
        async function cargarMisProcedimientos() {
            const listaDiv = document.getElementById('lista-procedimientos');
            const token = localStorage.getItem('tokenVet');
            
            if (!navigator.onLine) {
                listaDiv.innerHTML = `<div class="bg-amber-50 p-4 rounded-2xl shadow-sm border border-amber-200 text-center text-xs font-bold text-amber-700">Sin conexión. Visualización no disponible en modo offline.</div>`;
                return;
            }

            try {
                const res = await fetch('http://localhost:3000/api/registro-genetico', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    // FILTRO CORREGIDO: Acepta tanto "Pendiente" (registros antiguos) como "Pendiente Evaluación" (nuevos)
                    const misRegistros = data.data.filter(reg => 
                        reg.estadoPrenez === 'Pendiente Evaluación' || reg.estadoPrenez === 'Pendiente'
                    );

                    if (misRegistros.length === 0) {
                        listaDiv.innerHTML = `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center text-xs font-bold text-slate-500">No tienes procedimientos pendientes de revisión.</div>`;
                        return;
                    }

                    listaDiv.innerHTML = misRegistros.map(reg => `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <p class="font-bold text-slate-800 text-sm">${reg.productor || reg.finca || 'Productor no especificado'}</p>
                                    <p class="text-sky-600 font-bold text-xs">Chapeta: ${reg.arete || reg.animalId}</p>
                                </div>
                                <span class="bg-sky-100 text-sky-700 text-xs font-bold px-2 py-1 rounded-lg">${reg.tipoProcedimiento}</span>
                            </div>
                            <p class="text-xs text-slate-500 mb-2">Genética: ${reg.geneticaUtilizada || 'No especificada'}</p>
                            <div class="border-t border-slate-100 pt-2 flex justify-between gap-2 mt-2">
                                <button onclick="actualizarEstadoProcedimiento('${reg._id}', 'Preñada')" class="flex-1 bg-green-50 text-green-700 hover:bg-green-100 font-bold py-2 rounded-xl text-xs transition">Confirmar Preñez</button>
                                <button onclick="actualizarEstadoProcedimiento('${reg._id}', 'Vacía')" class="flex-1 bg-red-50 text-red-600 hover:bg-red-100 font-bold py-2 rounded-xl text-xs transition">Marcar Vacía</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                listaDiv.innerHTML = `<div class="bg-red-50 p-4 rounded-2xl shadow-sm border border-red-200 text-center text-xs font-bold text-red-700">Error al cargar procedimientos.</div>`;
            }
        }

        // ACTUALIZAR ESTADO DE PREÑEZ (DÍA 45)
        async function actualizarEstadoProcedimiento(id, nuevoEstado) {
            if (!confirm(`¿Confirmas que el resultado para este animal es: ${nuevoEstado}?`)) return;

            const token = localStorage.getItem('tokenVet');
            try {
                // Asegúrate de que esta ruta coincida con la declarada en las rutas (routes) de tu backend
                const res = await fetch(`http://localhost:3000/api/registro-genetico/${id}/prenez`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ estadoPrenez: nuevoEstado, observaciones: `Diagnóstico actualizado en campo: ${nuevoEstado}` })
                });

                const data = await res.json();
                if (data.success) {
                    alert(`✅ Estado actualizado a ${nuevoEstado}`);
                    cargarMisProcedimientos(); // Recarga la lista para que el animal desaparezca de "Pendientes"
                } else {
                    alert('Error: ' + data.mensaje);
                }
            } catch (error) {
                alert('No se pudo actualizar el estado. Verifica tu conexión a internet.');
            }
        }
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker activo en Dashboard'))
                    .catch(err => console.error('Error Service Worker:', err));
            });
        }
    </script>
</body>
</html>
