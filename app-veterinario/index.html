<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sembriogan Vet - Portal Operativo</title>
    <!-- Tailwind CSS para diseño móvil moderno e impecable -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Fuentes modernas: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos modernos: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 border border-slate-100">
        
        <!-- LOGO OFICIAL EN LUGAR DE TEXTO Y EMOJI -->
        <div class="flex flex-col items-center mb-8">
            <img src="img/logo.png" alt="Logo Sembriogan" class="h-16 object-contain mb-2">
            <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">Portal Operativo de Campo</p>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="form-login" class="space-y-5">
            
            <!-- Mensaje de Error Oculto inicialmente -->
            <div id="error-mensaje" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-xs font-bold text-center"></div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Correo Institucional</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
                    placeholder="tu-correo@sembriogan.com"
                >
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Contraseña</label>
                <div class="relative flex items-center">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 pr-11 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
                        placeholder="••••••••"
                    >
                    <button 
                        type="button" 
                        id="btn-toggle-password" 
                        class="absolute right-3 text-slate-400 hover:text-slate-600 transition p-1.5"
                        onclick="const p = document.getElementById('password'); const isP = p.type === 'password'; p.type = isP ? 'text' : 'password'; this.innerHTML = isP ? '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'m9.88 9.88 4.24 4.24\'/><path d=\'M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68\'/><path d=\'M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61\'/><line x1=\'2\' x2=\'22\' y1=\'2\' y2=\'22\'/></svg>' : '<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';"
                        title="Ver / Ocultar contraseña"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button 
                type="submit" 
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-600/20 transition duration-200 text-center"
            >
                Iniciar Jornada
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-slate-400 text-xs font-semibold">Sincronización Offline Habilitada 📱</p>
        </div>
    </div>

    <!-- Script de autenticación -->
    <script src="js/login.js"></script>
    
    <!-- Registro del Service Worker para PWA (Soporte Offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
