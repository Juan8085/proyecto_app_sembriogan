<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sembriogan - App Veterinario</title>
    <style>
        :root {
            --primary: #0284c7;
            --secondary: #22c55e;
            --dark: #0f172a;
            --light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--light); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-box { background: white; width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .login-box img { max-width: 120px; margin-bottom: 20px; }
        .login-box h2 { color: var(--dark); font-size: 1.5rem; margin-bottom: 5px; }
        .login-box p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: var(--primary); }
        
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Puedes usar tu logo aquí si lo copiaste a la carpeta img -->
        <h2 style="color: var(--primary)">Sembriogan 🐂</h2>
        <p>Portal Operativo de Campo</p>
        
        <form id="form-login-vet">
            <div class="input-group">
                <label for="email">Correo Institucional</label>
                <input type="email" id="email" required placeholder="tu-correo@sembriogan.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Iniciar Jornada</button>
        </form>
        <div id="error-msg" class="error-msg"></div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
