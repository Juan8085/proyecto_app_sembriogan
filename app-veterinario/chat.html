<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sembriogan Vet - Asistente IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header del Chat -->
    <header class="bg-white shadow-sm py-3 px-4 flex justify-between items-center z-40 border-b border-slate-200">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-inner">🤖</div>
            <div>
                <h1 class="text-sm font-bold text-slate-800">Dr. Sembriogan IA</h1>
                <p class="text-[10px] text-emerald-600 font-bold flex items-center gap-1">● Especialista Reproductivo</p>
            </div>
        </div>
        <a href="dashboard.html" class="text-sky-600 font-bold text-xs bg-sky-50 px-3 py-1.5 rounded-xl transition hover:bg-sky-100">← Volver</a>
    </header>

    <!-- Contenedor de Mensajes -->
    <main id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-md mx-auto w-full pb-20">
        <!-- Mensaje de bienvenida inicial de la IA -->
        <div class="flex items-start gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">IA</div>
            <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-slate-200 text-xs text-slate-800 leading-relaxed max-w-[85%]">
                ¡Hola, colega! Estoy conectado con los protocolos oficiales de Sembriogan. ¿Qué consulta tienes hoy en campo sobre <b>IATF, Transferencia de Embriones (TE), patologías o asistencia obstétrica</b>?
            </div>
        </div>
    </main>

    <!-- Barra de Sugerencias Rápidas -->
    <div class="bg-white/80 backdrop-blur border-t border-slate-100 px-3 py-2 flex gap-2 overflow-x-auto max-w-md mx-auto w-full scrollbar-hide">
        <button onclick="enviarSugerencia('Protocolo IATF Estándar')" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-[11px] font-bold px-3 py-1 rounded-full whitespace-nowrap transition">🐂 Protocolo IATF</button>
        <button onclick="enviarSugerencia('Protocolo Transferencia de Embriones')" class="bg-purple-50 text-purple-700 hover:bg-purple-100 text-[11px] font-bold px-3 py-1 rounded-full whitespace-nowrap transition">🧬 Protocolo TE</button>
        <button onclick="enviarSugerencia('Manejo de Metritis y flujo anormal')" class="bg-red-50 text-red-700 hover:bg-red-100 text-[11px] font-bold px-3 py-1 rounded-full whitespace-nowrap transition">🚨 Infecciones / Metritis</button>
    </div>

    <!-- Barra de Entrada de Texto (Fija abajo) -->
    <footer class="bg-white border-t border-slate-200 p-3 shadow-lg z-40">
        <form id="form-chat" onsubmit="enviarMensaje(event)" class="max-w-md mx-auto flex gap-2">
            <input type="text" id="input-mensaje" placeholder="Escribe tu consulta técnica..." autocomplete="off" class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-600 transition">
            <button type="submit" id="btn-enviar" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-sm">
                Enviar ➔
            </button>
        </form>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('tokenVet');
            if (!token) window.location.href = 'index.html';
        });

        function enviarSugerencia(texto) {
            document.getElementById('input-mensaje').value = texto;
            // Disparamos el envío automático
            document.getElementById('form-chat').requestSubmit();
        }

        async function enviarMensaje(e) {
            e.preventDefault();
            const input = document.getElementById('input-mensaje');
            const mensajeTexto = input.value.trim();
            if (!mensajeTexto) return;

            const contenedor = document.getElementById('chat-container');
            const token = localStorage.getItem('tokenVet');

            // 1. Renderizar mensaje del usuario
            contenedor.innerHTML += `
                <div class="flex items-start justify-end gap-2">
                    <div class="bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-xs leading-relaxed max-w-[85%]">
                        ${escaparHTML(mensajeTexto)}
                    </div>
                    <div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">Vet</div>
                </div>
            `;
            
            input.value = '';
            contenedor.scrollTop = contenedor.scrollHeight;

            // 2. Indicador de "Escribiendo..."
            const idCarga = 'carga-' + Date.now();
            contenedor.innerHTML += `
                <div id="${idCarga}" class="flex items-start gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">IA</div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-200 text-xs text-slate-400 italic">
                        Analizando protocolos veterinarios...
                    </div>
                </div>
            `;
            contenedor.scrollTop = contenedor.scrollHeight;

            try {
                // 3. Petición al Backend (ia.controller.js)
                const res = await fetch('http://localhost:3000/api/ia/consultar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ mensaje: mensajeTexto, rol: 'veterinario' })
                });

                const data = await res.json();
                
                // Remojemos el indicador de carga
                document.getElementById(idCarga).remove();

                if (data.success) {
                    // Convertimos saltos de línea lógicos en etiquetas <br> para formatear viñetas
                    const respuestaFormateada = data.respuesta.replace(/\n/g, '<br>');
                    
                    contenedor.innerHTML += `
                        <div class="flex items-start gap-2">
                            <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">IA</div>
                            <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-slate-200 text-xs text-slate-800 leading-relaxed max-w-[85%] space-y-1">
                                ${respuestaFormateada}
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "No se pudo procesar la respuesta.");
                }
            } catch (error) {
                document.getElementById(idCarga).remove();
                contenedor.innerHTML += `
                    <div class="flex items-start gap-2">
                        <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">!</div>
                        <div class="bg-red-50 text-red-700 p-3 rounded-2xl text-xs border border-red-200">
                            Error de comunicación con el asistente. Verifica tu conexión de red.
                        </div>
                    </div>
                `;
            }

            contenedor.scrollTop = contenedor.scrollHeight;
        }

        function escaparHTML(texto) {
            return texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
