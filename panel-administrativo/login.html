<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sembriogan Admin</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card img { height: 80px; margin-bottom: 20px; }
        .hidden { display: none; }
        .toggle-link { margin-top: 20px; font-size: 0.85rem; color: var(--primary-color); cursor: pointer; display: block; }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/logo.png" alt="Sembriogan Logo">
        
        <!-- FORMULARIO DE LOGIN -->
        <div id="contenedor-login">
            <h2 style="color: var(--primary-color); margin-bottom: 20px;">Iniciar Sesión</h2>
            <form id="form-login">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="admin@sembriogan.com">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 25px;">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
            </form>
            <p id="mensaje-error" style="color: red; margin-top: 15px; display: none; font-size: 0.9rem;"></p>
            <span class="toggle-link" id="btn-mostrar-registro">¿No tienes cuenta de Administrador? Regístrate aquí</span>
        </div>

        <!-- FORMULARIO DE REGISTRO INICIAL -->
        <div id="contenedor-registro" class="hidden">
            <h2 style="color: var(--primary-color); margin-bottom: 20px;">Registro Inicial (Admin)</h2>
            <form id="form-registro-inicial">
                <div class="form-group" style="text-align: left;">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" required placeholder="Tu Nombre">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" required placeholder="admin@sembriogan.com">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 25px;">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; background: #22c55e;">Crear Cuenta Admin</button>
            </form>
            <p id="mensaje-registro" style="color: green; margin-top: 15px; display: none; font-size: 0.9rem;"></p>
            <span class="toggle-link" id="btn-mostrar-login">← Volver al Login</span>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
