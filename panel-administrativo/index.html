<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Sembriogan</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar de navegación -->
        <aside class="sidebar">
            <div class="logo-container">
                <img src="img/logo.png" alt="Sembriogan Logo" class="logo-img">
            </div>
            <ul>
                <li><a href="#" class="active">Dashboard / Solicitudes</a></li>
                <li><a href="#">Catálogo de Servicios</a></li>
                <li><a href="#">Configuración</a></li>
            </ul>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="top-header">
                <h1>Gestión de Solicitudes y Servicios</h1>
                <span class="user-role">Administrador</span>
            </header>

            <!-- Formulario para Registrar Solicitud -->
            <section class="card">
                <h2>Registrar Nueva Solicitud</h2>
                <form id="form-solicitud">
                    <div class="form-group">
                        <label for="productor">Productor:</label>
                        <input type="text" id="productor" required placeholder="Nombre del productor">
                    </div>
                    <div class="form-group">
                        <label for="finca">Finca:</label>
                        <input type="text" id="finca" required placeholder="Nombre de la finca">
                    </div>
                    <div class="form-group">
                        <label for="servicio">Servicio:</label>
                        <input type="text" id="servicio" required placeholder="Ej. Inseminación Artificial">
                    </div>
                    <button type="submit" class="btn-primary">Guardar Solicitud</button>
                </form>
            </section>

            <!-- Sección de Solicitudes -->
            <section class="card">
                <h2>Solicitudes Recientes (MongoDB)</h2>
                <table id="tabla-solicitudes">
                    <thead>
                        <tr>
                            <th>Productor</th>
                            <th>Finca</th>
                            <th>Servicio</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dinámico con JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
