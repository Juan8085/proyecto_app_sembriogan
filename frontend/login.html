<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sembriogan - Acceso Administrativo</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-theme-wrapper">
        <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar Tema">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <img src="img/image-removebg-preview.png" alt="Logo Sembriogan" class="login-logo">
                <h2>Panel Administrativo</h2>
                <p class="subtitle">Gestión biotecnológica y control operativo</p>
            </div>

            <div class="login-tabs">
                <button class="login-tab-btn active" id="tab-login-btn">Iniciar Sesión</button>
                <button class="login-tab-btn" id="tab-register-btn">Registrar Admin</button>
            </div>

            <form id="form-login" class="login-form active" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="login-user"><i class="fas fa-user"></i> Usuario o Correo</label>
                    <input type="text" id="login-user" placeholder="ej. admin@sembriogan.com" required>
                </div>

                <div class="form-group">
                    <label for="login-pass"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" id="toggle-login-pass"></i>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-session" checked>
                        <span>Recordar sesión</span>
                    </label>
                    <a href="#" class="forgot-pass">¿Olvidó su clave?</a>
                </div>

                <button type="submit" id="btn-submit-login" class="btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Ingresar al Sistema
                </button>
            </form>

            <form id="form-register" class="login-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="reg-name"><i class="fas fa-id-card"></i> Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Ej. Juan Pablo Porras" required>
                </div>

                <div class="form-group">
                    <label for="reg-email"><i class="fas fa-envelope"></i> Correo Corporativo</label>
                    <input type="email" id="reg-email" placeholder="usuario@sembriogan.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-pass"><i class="fas fa-key"></i> Contraseña Maestra</label>
                    <input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="reg-code"><i class="fas fa-shield-alt"></i> Código de Autorización</label>
                    <input type="password" id="reg-code" placeholder="Clave de seguridad de la empresa" required>
                </div>

                <button type="submit" id="btn-submit-register" class="btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Crear Cuenta Administrativa
                </button>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 Sembriogan S.A.S. - Todos los derechos reservados</p>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
